[project]
name = "rec2note"
version = "0.2.0"
description = "Turn recordings into desired artifacts (minutes, lecture notes, …) via pluggable skills, backends, and exporters"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-genai>=1.56.0",
    "huggingface-hub>=1.1.5",
    "markdown>=3.10.2",
    "mlx-lm>=0.19.0",
    "mlx-vlm>=0.1.0",
    "openai>=2.38.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
